name: Tests

on:
  push:
    paths:
      - "Analysis/**"
      - "Pipeline/**"
      - "Scripts/**"
      - "Tests/**"
      - "EggPaisaTests/*.html"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Pipeline/requirements.txt

      - name: Install
        run: pip install -r Pipeline/requirements.txt

      - name: Price reader, forecast job and monthly job
        run: python -m unittest discover -s Tests -t . -v
