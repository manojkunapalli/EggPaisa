name: Daily forecast

on:
  schedule:
    # 11:30 and 19:30 IST; NECC usually has the day's prices up by late morning.
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Pipeline/requirements.txt

      - name: Install
        run: pip install -r Pipeline/requirements.txt

      - name: Read NECC prices and forecast
        run: python Pipeline/forecast.py

      - name: Save the new prices
        run: |
          git add Data/necc_daily.csv Data/festival_calendar.csv EggPaisa/Resources/necc_prices.json
          if git diff --cached --quiet; then
            echo "No new NECC prices"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "NECC prices to $(jq -r .origin Public/forecast.json)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Public

      - id: deploy
        uses: actions/deploy-pages@v4
