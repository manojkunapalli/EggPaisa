name: Daily forecast

on:
  schedule:
    # 11:30 and 19:30 IST; NECC usually has the day's prices up by late morning.
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      rebuild_months:
        description: Rebuild High-price months now, without waiting for a new complete month
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Pipeline/requirements.txt

      - name: Install
        run: pip install -r Pipeline/requirements.txt

      - name: Read NECC prices and forecast
        run: python Pipeline/forecast.py

      # Works once a month, after NECC's last price of the month; if it fails, last month's file stays.
      - name: Festival effects and High-price months
        continue-on-error: true
        run: python Pipeline/patterns.py ${{ inputs.rebuild_months && '--force' || '' }}

      # The app reads these too: the prices when NECC's site can't be read, and each month's new High-price months.
      - name: Publish the prices and High-price months
        run: |
          cp EggPaisa/Resources/necc_prices.json Public/prices.json
          cp EggPaisa/Resources/necc_month_pattern.json Public/month_pattern.json

      - name: Save the new prices
        run: |
          git add Data/necc_daily.csv Data/festival_calendar.csv Data/festival_effects.csv \
                  EggPaisa/Resources/necc_prices.json EggPaisa/Resources/necc_month_pattern.json
          if git diff --cached --quiet; then
            echo "No new NECC prices"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "NECC prices to $(jq -r .origin Public/forecast.json)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: Public

      - id: deploy
        uses: actions/deploy-pages@v5
